# PPG-StressPi — Compose Specification (sin campo version)
# Uso (desde ppg-stresspi/pc/):  docker compose up -d --build

name: ppg-stresspi

services:

  # ───────────────────────── KAFKA (KRaft, un nodo) ─────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.8
    hostname: kafka
    container_name: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"       # listener EXTERNAL para la Pi 5
    environment:
      # --- KRaft: un solo nodo que es broker y controller ---
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Define KAFKA_CLUSTER_ID en .env}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners ---
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${HOST_IP:?Define HOST_IP en .env}:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Un solo broker: factores de replicación en 1 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Topics y almacenamiento ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ppg-net
    restart: unless-stopped

  # ───────────────────────── SPARK (métricas HRV) ─────────────────────────
  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    hostname: spark
    container_name: spark
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SQLITE_PATH: /data/ppg.db
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./spark:/app              # código en vivo
      - ../data:/data             # SQLite compartido
      - ./db:/app/db:ro           # esquema (equivale a ../pc/db)
    networks:
      - ppg-net
    restart: unless-stopped

  # ───────────────────────── PULSE-PPG (clasificación de estrés) ─────────────────────────
  pulseppg:
    build:
      context: ./pulseppg
      dockerfile: Dockerfile
    hostname: pulseppg
    container_name: pulseppg
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SQLITE_PATH: /data/ppg.db
      WEIGHTS_DIR: /app/weights
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./pulseppg:/app                   # código en vivo
      - ./pulseppg/weights:/app/weights:ro  # pesos del modelo (Zenodo)
      - ../data:/data                     # SQLite compartido
    networks:
      - ppg-net
    restart: unless-stopped

  # ───────────────────────── DASHBOARD (Flask + Chart.js) ─────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    hostname: dashboard
    container_name: dashboard
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SQLITE_PATH: /data/ppg.db
      PYTHONUNBUFFERED: "1"
    ports:
      - "${DASHBOARD_PORT:-5000}:5000"
    volumes:
      - ./dashboard:/app          # código en vivo
      - ../data:/data             # SQLite compartido
    networks:
      - ppg-net
    restart: unless-stopped

networks:
  ppg-net:
    name: ppg-net
    driver: bridge

volumes:
  kafka-data:
